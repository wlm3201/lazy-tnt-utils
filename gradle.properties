# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties（根项目元数据；各 MC 版本的依赖版本在对应子项目的 gradle.properties 中声明）
mod_version=1.0.1
maven_group=net.orbitalstrike

# 模组内置信息：构建时写入 fabric.mod.json（单一来源），Modrinth / GitHub 等项目页可直接取用。
mod_id=lazytntutils
mod_name=Lazy TNT Utils
mod_description=Accurate TNT and item entity visualization in lazy chunks, with fuse timers, motion vectors and precise explosion particles. Built for orbital-strike and weak-loaded TNT engineering.
mod_author=wlm3201
mod_license=MIT
mod_homepage=https://github.com/wlm3201/lazy-tnt-utils
mod_sources=https://github.com/wlm3201/lazy-tnt-utils
mod_issues=https://github.com/wlm3201/lazy-tnt-utils/issues
