# 本文件是一个「MC 版本子项目」的全部配置：新增版本 = 复制本文件到新目录（如 v26_2/）
# + 在 settings.gradle 注册 include，再改下面 4 个值即可（源码共用根目录 src/main + src/client）。
# 产物名由 mod_id + version + mc 自动拼出（见根 build.gradle 的 jar 块），无需在这里声明。
mc=26.2
loader=0.19.5
fapi=0.159.0+26.2
javaRelease=25
# 配置界面依赖：YACL 版本号自带 MC 版本后缀，ModMenu 则是独立版本号，两者都要挑对应 MC 的那一版。
yacl=3.9.7+26.2-fabric
modmenu=20.0.3
